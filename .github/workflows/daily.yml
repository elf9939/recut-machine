name: Recut Media daily batch
on:
  workflow_dispatch:      # started each morning by cron-job.org
    inputs:
      want: { description: 'How many creators', default: '15' }
concurrency: { group: recut, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install ffmpeg + fonts
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ttf-mscorefonts-installer >/dev/null && fc-cache -f >/dev/null
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-en }
      - run: pip install -q faster-whisper yt-dlp
      - name: Find creators, make clips, fill the Outreach tab
        env:
          PH_AUTOMATION_KEY: ${{ secrets.PH_AUTOMATION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python recut/run.py --want "${{ inputs.want || '15' }}"
      - name: Remember who we already looked at
        run: |
          git config user.name "recut-bot"; git config user.email "recut-bot@users.noreply.github.com"
          git add data/seen.txt && git commit -qm "seen list" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
